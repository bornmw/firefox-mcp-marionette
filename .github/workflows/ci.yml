name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: |
          node --check src/protocol.mjs
          node --check src/marionette.mjs
          node --check src/server.mjs

      - name: Run tests
        run: node --test test/*.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firefox runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libcairo-gobject2 libcairo2 libcups2t64 libdbus-1-3 libdbus-glib-1-2 \
            libfontconfig1 libfreetype6 libglib2.0-0t64 libgtk-3-0t64 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 \
            libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 \
            libxrender1 libxtst6 libnspr4 libnss3 libgbm1 libxshmfence1

      - name: Download latest Firefox
        run: |
          curl -fsSL -o firefox.tar.xz "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US"
          tar xf firefox.tar.xz
          sudo mv firefox /opt/firefox
          /opt/firefox/firefox --version

      - name: Run e2e suites (headless Marionette Firefox, one browser on 2828)
        run: |
          mkdir -p /tmp/ff-e2e
          printf 'user_pref("marionette.enabled", true);\nuser_pref("marionette.port", 2828);\n' > /tmp/ff-e2e/user.js
          /opt/firefox/firefox --headless --marionette --no-remote -profile /tmp/ff-e2e >/tmp/ff-e2e.log 2>&1 &
          FF_PID=$!
          trap "kill $FF_PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/2828) 2>/dev/null && break
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/2828) 2>/dev/null || { echo "marionette never came up on 2828"; cat /tmp/ff-e2e.log; exit 1; }
          node scripts/e2e-live.mjs 2828
          node scripts/e2e-forms.mjs 2828
          node scripts/e2e-gates.mjs 2828
          node scripts/e2e-shadow.mjs 2828
